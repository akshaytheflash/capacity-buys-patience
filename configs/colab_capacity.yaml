# H1 capacity sweep, night-sized: 3 rho x 4 widths x 2 seeds = 24 runs x 40 epochs
# ~20s/epoch on T4 with 20k images => ~5.3 GPU-hours
inherits: base.yaml
out_dir: results/raw/capacity
data:
  num_train: 20000
  num_test: 2000
  num_shortcut_probe: 2000
  num_shortcut_only_test: 2000
  num_workers: 2
grid:
  seeds: [0, 1]
  width: [0.25, 0.5, 1.0, 2.0]
  depth: [18]
  shortcut_correlation: [0.85, 0.95, 0.99]
train:
  epochs: 40
